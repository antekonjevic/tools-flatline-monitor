<!doctype html>
<html lang="en">
  <head>
    <title>Something went wrong · Flatline</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="icon" href="/icon.png" type="image/png">

    <!-- Self-contained on purpose: this page must work even when the app can't
         serve its stylesheet. Colors match app/assets/stylesheets/application.css. -->
    <script>
      // Use the theme picked with Flatline's theme switch, if there is one.
      (function () {
        var match = document.cookie.match(/(?:^|;\s*)theme=(light|dark)(?:;|$)/);
        if (match) document.documentElement.setAttribute("data-theme", match[1]);
      })();
    </script>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f9;
        --surface: #ffffff;
        --surface-muted: #f0f2f5;
        --border: #e2e5ea;
        --text: #16181d;
        --text-muted: #5f6673;
        --accent: #1f2937;
        --accent-text: #ffffff;
        --link: #2554c7;
        --logo-ring: transparent;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --bg: #0f1115;
          --surface: #171a20;
          --surface-muted: #1e222a;
          --border: #2a2f39;
          --text: #e8eaee;
          --text-muted: #9aa1ad;
          --accent: #e8eaee;
          --accent-text: #0f1115;
          --link: #8fb0ff;
          --logo-ring: rgb(255 255 255 / 0.1);
        }
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #0f1115;
        --surface: #171a20;
        --surface-muted: #1e222a;
        --border: #2a2f39;
        --text: #e8eaee;
        --text-muted: #9aa1ad;
        --accent: #e8eaee;
        --accent-text: #0f1115;
        --link: #8fb0ff;
        --logo-ring: rgb(255 255 255 / 0.1);
      }

      *, *::before, *::after { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 32px 16px;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        -webkit-text-size-adjust: 100%;
        text-align: center;
      }

      main { width: 100%; max-width: 440px; margin-bottom: 10vh; }

      .logo {
        display: block;
        width: 48px;
        height: 48px;
        margin: 0 auto 28px;
        border-radius: 25%;
        box-shadow: 0 0 0 1px var(--logo-ring);
      }

      .code {
        margin: 0 0 8px;
        color: var(--text-muted);
        font: 600 0.8rem/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 1.5rem;
        font-weight: 650;
        line-height: 1.25;
        letter-spacing: -0.01em;
      }

      p { margin: 0 0 24px; color: var(--text-muted); }

      code {
        font: 0.85em ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        background: var(--surface-muted);
        padding: 1px 5px;
        border-radius: 4px;
        white-space: nowrap;
      }

      .actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

      .button {
        display: inline-flex;
        align-items: center;
        min-height: 38px;
        padding: 8px 14px;
        border: 1px solid var(--accent);
        border-radius: 8px;
        background: var(--accent);
        color: var(--accent-text);
        font-weight: 550;
        text-decoration: none;
      }
      .button:hover { opacity: 0.9; }
      .button-quiet { background: var(--surface); color: var(--text); border-color: var(--border); }
      .button-quiet:hover { background: var(--surface-muted); opacity: 1; }
      .button:focus-visible { outline: 2px solid var(--link); outline-offset: 1px; }
    </style>
  </head>

  <body>
    <main>
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><rect width="32" height="32" rx="8" fill="#1f2937"/><path d="M5 17h7l2.5-6 3.5 11 2.5-5H27" fill="none" stroke="#34c172" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <p class="code">Error 500</p>
      <h1>Something went wrong</h1>
      <p>Flatline ran into an error on its side. Try again in a moment. If it keeps happening and you run this Flatline, the details are in the server log: <code>journalctl -u flatline-web</code>.</p>
      <div class="actions">
        <a class="button" href="">Try again</a>
        <a class="button button-quiet" href="/">Go to Flatline</a>
      </div>
    </main>
  </body>
</html>
